<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de previsão do tempo</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
  form{display:flex;gap:8px}
  input{flex:1;padding:10px;border-radius:8px;border:0}
  button{padding:10px 16px;border:0;border-radius:8px;background:#f0ab4d;font-weight:700;cursor:pointer}
  .now{margin:18px 0 4px;font-size:44px;font-weight:700}
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
  .d{background:#1e293b;border-radius:10px;padding:10px;text-align:center;font-size:13px}
</style>
</head>
<body>
<form id="f">
  <input id="q" value="São Paulo" placeholder="Digite uma cidade" required>
  <button>Buscar</button>
</form>
<div id="out"></div>

<script>
const out = document.getElementById('out');
const icon = c => c === 0 ? '☀️' : c < 3 ? '⛅' : c < 50 ? '🌫️' : c < 70 ? '🌧️' : c < 80 ? '❄️' : c < 95 ? '🌦️' : '⛈️';
const esc = s => s.replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';');

// dados de exemplo, usados se a API estiver fora do ar / sem internet
const EXEMPLO = {
  current: { temperature_2m: 24, relative_humidity_2m: 68, weather_code: 2 },
  daily: {
    time: Array.from({ length: 6 }, (_, i) => new Date(Date.now() + i * 864e5).toISOString().slice(0, 10)),
    weather_code: [2, 3, 61, 80, 1, 0],
    temperature_2m_max: [26, 25, 22, 21, 27, 29],
    temperature_2m_min: [17, 16, 15, 15, 17, 18]
  }
};

async function buscar(cidade) {
  out.textContent = 'Carregando...';
  try {
    const geo = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name=' + encodeURIComponent(cidade))).json();
    if (!geo.results) { out.textContent = 'Cidade não encontrada.'; return; }
    const { latitude, longitude, name } = geo.results[0];
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + latitude + '&longitude=' + longitude +
      '&current=temperature_2m,relative_humidity_2m,weather_code' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Erro HTTP ' + resp.status);
    mostrar(name, await resp.json());
  } catch (erro) {
    mostrar(cidade + ' (dados de exemplo — sem conexão com a API)', EXEMPLO);
  }
}

function mostrar(nome, w) {
  const c = w.current, d = w.daily;
  const dias = d.time.slice(1, 6).map((t, i) =>
    '<div class="d"><b>' + new Date(t + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'short' }) + '</b><br>' +
    icon(d.weather_code[i + 1]) + '<br>' +
    Math.round(d.temperature_2m_max[i + 1]) + '° / ' + Math.round(d.temperature_2m_min[i + 1]) + '°</div>'
  ).join('');
  out.innerHTML =
    '<div class="now">' + icon(c.weather_code) + ' ' + Math.round(c.temperature_2m) + '°C</div>' +
    '<div>' + esc(nome) + ' · umidade ' + c.relative_humidity_2m + '%</div>' +
    '<h4>Próximos dias</h4><div class="days">' + dias + '</div>';
}

document.getElementById('f').onsubmit = e => { e.preventDefault(); buscar(q.value.trim()); };
buscar('São Paulo');
</script>
</body>
</html>
